# Render Blueprint for the API. New > Blueprint > pick this repo, then fill in the two secrets below.
# (Free plan: the service sleeps after ~15 min idle, so the first request after a pause takes ~30-60 s.)
services:
  - type: web
    name: wardwatch-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Neon (or any Postgres) *direct* connection string, ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Your GitHub Pages origin, no path and no trailing slash: https://kdkapsikar.github.io
      - key: CORS_ORIGINS
        sync: false
